[project]
name = "django-peeringdb"
version = "3.7.0"
description = "PeeringDB Django models"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [{ name = "PeeringDB", email = "support@peeringdb.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet",
]
requires-python = ">=3.11"
dependencies = [
  "django_countries>1",
  "django_handleref>=2",
  "django_inet>=1",
  "asgiref>=3",
  "django>=5.0,<6",
]

[dependency-groups]
dev = [
  # testing
  "codecov>=2",
  "coverage>=5",
  "pytest>=6",
  "pytest-django>=3.8",
  "pytest-cov",
  "tox>=3.24",
  "tox-gh-actions>=3",
  "tox-uv>=1.13.0",

  # linting
  "mypy>=2.0",
  "django-stubs[compatible-mypy]",
  "pre-commit>=2.13",
  "ruff",

  # docs
  "markdown",
  "markdown-include>=0.5,<1",
  "mkdocs>=1.2.3",

  # ctl
  "ctl>=1",
  "jinja2>=2",
  "tmpl>=1",
  "twine>=3.3",
]

[project.urls]
repository = "https://github.com/peeringdb/django-peeringdb"

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's implicit defaults, which
# change between minor releases (0.16 added RUF/DTZ/PIE/PLR rules to the
# default set, surfacing 111 findings in this codebase). New rules are now an
# explicit opt-in instead of arriving with a version bump.
select = [
    "E4", # pycodestyle: imports
    "E7", # pycodestyle: statements
    "E9", # pycodestyle: runtime errors
    "F",  # pyflakes
]
extend-select = [
    "I",       # isort
    "UP",      # pyupgrade
    "PIE",     # flake8-pie
    "RUF",     # ruff-specific
    "PLR0402", # manual-from-import
]
# Deliberately not enabled:
#   DTZ  - this library works with naive datetimes on purpose
#          (USE_TZ=False + PEERINGDB_SYNC_STRIP_TZ); see test_timezone.py.
#   PLR  - beyond PLR0402, PLR2004 (magic-value-comparison) is noise in tests.

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django; makemigrations would drop any annotation.
"src/django_peeringdb/migrations/*" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
strict = false
ignore_missing_imports = true
disable_error_code = ["attr-defined", "import-not-found", "misc"]

exclude = [
    "tests/",
    "migrations/",
    "build/",
    ".tox/",
]

[[tool.mypy.overrides]]
module = [
    "django_peeringdb.models.abstract",
    "django_peeringdb.models.concrete",
]
disable_error_code = [
    "attr-defined",
    "import-not-found",
    "misc",
    "django-manager-missing",
]

[tool.django-stubs]
django_settings_module = "tests.settings"
strict_settings = false

[tool.uv]
dev-dependencies = [
    "django-stubs-ext>=5.2.2",
    "django-stubs[compatible-mypy]>=5.2.2",
    "monkeytype>=23.3.0",
    "pre-commit>=4.2.0",
    "pytest-django>=4.11.1",
    "pytest>=8.4.1",
]

