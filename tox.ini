[tox]
envlist =
    py{311,312}-django50
    py{311,312,313}-django51
    py{311,312,313,314}-django52
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
# runner = uv-venv-lock-runner
# runner = uv-venv-runner
# uv_sync_flags = --no-editable, --inexact
allowlist_externals = pytest
deps =
    pytest>=6
    pytest-django>=3.8
    pytest-cov
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
commands =
    pytest tests/ --cov=django_peeringdb --cov-report=term-missing --cov-report=xml

[pytest]
norecursedirs = data gen .tox
